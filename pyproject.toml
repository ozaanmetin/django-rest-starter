[project]
name = "drf-starter"
version = "0.1.0"
description = "DRF REST Starter - A Django-based backend starter project."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    # Django Core
    "django>=5.2.0,<5.3",
    "djangorestframework>=3.15.0,<4.0",
    "django-environ>=0.11.2,<1.0",
    "django-filter>=24.0,<25.0",
    "django-cors-headers>=4.5.0,<5.0",
    "django-model-utils>=5.0.0,<6.0",
    "django-cleanup>=8.1.0,<9.0",
    # Authentication & Security
    "djangorestframework-simplejwt>=5.4.0,<6.0",
    "argon2-cffi>=23.1.0,<24.0",
    # API Documentation
    "drf-spectacular>=0.28.0,<1.0",
    # Database
    "psycopg2-binary>=2.9.10,<3.0",
    # Cache & Message Queue
    "redis>=5.2.0,<6.0",
    "django-redis>=5.4.0,<6.0",
    # Celery
    "celery[redis]>=5.4.0,<6.0",
    "django-celery-beat>=2.7.0,<3.0",
    "django-celery-results>=2.5.0,<3.0",
    # HTTP Client
    "httpx>=0.28.0,<1.0",
    # Logging
    "python-json-logger>=2.0.0,<3.0",
    # Admin
    "django-admin-autocomplete-filter>=0.7.0,<1.0",
    "django-admin-rangefilter>=0.13.0,<1.0",
    # Server
    "gunicorn>=23.0.0,<24.0",
    "django-extensions>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.11.1",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "ipython>=8.18.0",
    "django-debug-toolbar>=4.2.0",
    "bandit[toml]>=1.7.10",
]
sentry = [
    "sentry-sdk>=2.19.0,<3.0",
]
otel = [
    # OpenTelemetry Core
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    # OTLP Exporters (traces, metrics, logs - all via single protocol)
    "opentelemetry-exporter-otlp>=1.25.0",
    # Auto-instrumentation
    "opentelemetry-instrumentation-django>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-psycopg2>=0.46b0",
    # System metrics
    "opentelemetry-instrumentation-system-metrics>=0.46b0",
]
all = [
    "drf-starter[dev,sentry,otel]",
]

# Pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--reuse-db",
    "--nomigrations",
    "-p", "no:warnings",
    "--strict-markers",
]
testpaths = ["apps"]

# Ruff
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "static",
    "media",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "F403",   # 'from module import *' used; unable to detect undefined names
    "B904",   # raise ... from err
    "E722",   # do not use bare 'except'
    "E402",   # module level import not at top of file
    # TODO: Re-enable these later
    "F405",   # name may be undefined, or defined from star imports
    "F401",   # imported but unused

]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.format]
skip-magic-trailing-comma = false

# Coverage
[tool.coverage.run]
source = ["apps"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__pycache__/*",
]


# Bandit
[tool.bandit]
skips = ["B101", "B110"]  # assert used
targets = ["apps", "config"]
exclude = ["migrations", "tests", "__pycache__"]
